<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ profile.display_username }} — Telegram</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #667085;
      --line: #d9dee8;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 32px auto;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    .back {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: 600;
    }
    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 10px;
      overflow-wrap: anywhere;
      font-size: clamp(32px, 5vw, 56px);
      letter-spacing: 0;
    }
    .id {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(112px, 1fr));
      gap: 10px;
      min-width: 260px;
    }
    .metric {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .metric strong {
      display: block;
      font-size: 28px;
      line-height: 1.1;
    }
    .metric span {
      color: var(--muted);
      font-size: 13px;
    }
    .content {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }
    .chart-wrap {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .chart {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 0 auto;
    }
    .chart-bg {
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 7;
    }
    .chart-segment {
      fill: none;
      stroke-width: 7;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .chart-label {
      fill: var(--text);
      font-size: 5px;
      font-weight: 700;
      text-anchor: middle;
    }
    .chart-sub {
      fill: var(--muted);
      font-size: 3px;
      text-anchor: middle;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-weight: 700;
      background: #f1f4f9;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .channel-name {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 600;
    }
    .swatch {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color);
    }
    .number {
      text-align: right;
      white-space: nowrap;
    }
    @media (max-width: 760px) {
      main {
        margin-top: 20px;
      }
      .summary,
      .content {
        grid-template-columns: 1fr;
      }
      .metrics {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="{{ request.url_for('index') }}">← все пользователи</a>

    <section class="summary">
      <div>
        <h1>{{ profile.display_username }}</h1>
        <p class="id">id: {{ profile.tg_id }}</p>
      </div>
      <div class="metrics" aria-label="Сводка">
        <div class="metric">
          <strong>{{ profile.total_messages }}</strong>
          <span>сообщений</span>
        </div>
        <div class="metric">
          <strong>{{ profile.channel_count }}</strong>
          <span>каналов</span>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="chart-wrap" aria-label="Распределение сообщений по каналам">
        <svg class="chart" viewBox="0 0 42 42" role="img" aria-labelledby="chart-title chart-desc">
          <title id="chart-title">Круговая диаграмма каналов</title>
          <desc id="chart-desc">Доля сообщений пользователя по каналам</desc>
          <circle class="chart-bg" cx="21" cy="21" r="15.915"></circle>
          {% for channel in profile.channels %}
            <circle
              class="chart-segment"
              cx="21"
              cy="21"
              r="15.915"
              stroke="{{ channel.color }}"
              stroke-dasharray="{{ channel.dasharray }}"
              stroke-dashoffset="{{ channel.dashoffset }}"
            ></circle>
          {% endfor %}
          <text class="chart-label" x="21" y="20.5">{{ profile.total_messages }}</text>
          <text class="chart-sub" x="21" y="25">сообщений</text>
        </svg>
      </div>

      <table>
        <thead>
          <tr>
            <th>Канал</th>
            <th class="number">Сообщений</th>
            <th class="number">Доля</th>
          </tr>
        </thead>
        <tbody>
          {% for channel in profile.channels %}
            <tr>
              <td>
                <span class="channel-name">
                  <span class="swatch" style="--color: {{ channel.color }}"></span>
                  {{ channel.name }}
                </span>
              </td>
              <td class="number">{{ channel.message_count }}</td>
              <td class="number">{{ channel.percent }}%</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
