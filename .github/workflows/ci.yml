name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ vars.USERNAME }}/tg-parser-ci:latest
    env:
      API_ID: ${{ vars.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run basic checks
        run: python -m compileall .

      - name: Run unit tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The server serves frontend/dist; unpack this artifact there where Node is
      # not available (Termux).
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  bump_version:
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ vars.USERNAME }}/tg-parser-ci:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install commitizen

      - name: Debug release context
        run: |
          git --no-pager log --oneline -n 10
          git tag --list | tail -n 20
          cz version

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version with Commitizen
        run: |
          cz bump --yes || cz bump --yes --increment PATCH

      - name: Push release branch and tag
        run: |
          release_branch="release/ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_tag="$(git describe --tags --abbrev=0)"
          git push origin "HEAD:${release_branch}"
          git push origin "refs/tags/${release_tag}"
          echo "Release commit pushed to ${release_branch} with tag ${release_tag}. Open a pull request into main to satisfy branch protection."
